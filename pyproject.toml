[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tools-yt-autopilot"
version = "0.1.0"
description = "Fully automated source-grounded daily YouTube video pipeline for AI tools tutorials and explainers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "feedparser>=6.0.11",
    "trafilatura>=1.8.0",
    "google-genai>=0.1.1",
    "google-generativeai>=0.8.0",
    "anthropic>=0.25.0",
    "edge-tts>=6.1.12",
    "pillow>=10.3.0",
    "google-api-python-client>=2.128.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "python-dotenv>=1.0.1"
]

[tool.setuptools.packages.find]
include = ["autopilot*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.1",
    "ruff>=0.4.4"
]

[project.scripts]
autopilot = "autopilot.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
