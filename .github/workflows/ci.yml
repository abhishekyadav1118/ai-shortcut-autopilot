name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Ruff + Pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-dejavu-core
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Doctor (informational, never fails CI)
        run: python -m autopilot doctor || true

      - name: Run Unit Tests
        run: pytest tests/unit/ -v --tb=short
        env:
          # Tests run fully offline — no real API keys needed
          LLM_API_KEY: "ci_dummy_key"
          PEXELS_API_KEY: "ci_dummy_key"
