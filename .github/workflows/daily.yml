name: Daily YouTube Autopilot

on:
  schedule:
    # 07:00 UTC primary cron (well before 10:00 AM New York / 14:00/15:00 UTC)
    - cron: "0 7 * * *"
    # 09:00 UTC backup cron (exits early if already published today)
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Publish mode"
        required: true
        default: "review"
        type: choice
        options:
          - review
          - auto
          - package
      dry_run:
        description: "Dry run (no external API side effects / uploads)"
        required: false
        default: false
        type: boolean
      topic_url:
        description: "Force specific topic URL (optional)"
        required: false
        default: ""
        type: string

concurrency:
  group: youtube-autopilot
  cancel-in-progress: false

jobs:
  autopilot-run:
    name: Run Daily Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Diagnostics (Doctor)
        run: |
          python -m autopilot doctor || true
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Execute Autopilot Pipeline
        run: |
          MODE="${{ inputs.mode || 'review' }}"
          DRY_RUN="${{ inputs.dry_run == true && '--dry-run' || '' }}"
          TOPIC_URL="${{ inputs.topic_url != '' && format('--topic-url {0}', inputs.topic_url) || '' }}"
          python -m autopilot run --mode "$MODE" $DRY_RUN $TOPIC_URL
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-package-${{ github.run_id }}
          path: out/
          retention-days: 7

      - name: Commit Updated State
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state/published.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update published state [skip ci]" && git push)
